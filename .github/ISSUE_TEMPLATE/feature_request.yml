name: Feature request
description: A change or addition to the public API
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        The public surface is deliberately small. A proposal is most likely to
        land if it describes a problem the current API handles badly rather than
        an export to add.

  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you were trying to do, and where the current API got in the way.
    validations:
      required: true

  - type: textarea
    id: today
    attributes:
      label: What you do today
      description: The workaround, if there is one. It is often the clearest statement of the gap.
      render: ts

  - type: textarea
    id: proposal
    attributes:
      label: What you would like instead
      description: A sketch of the API, if you have one in mind. Rough is fine.
      render: ts
