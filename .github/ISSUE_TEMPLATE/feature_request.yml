name: Feature request
description: A new capability, option or integration
labels: ['enhancement']
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do that you cannot do today.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you have in mind
      description: The API or behaviour you would add.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
