name: Bug report
description: Something that does not work the way the docs say it should
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        For a security issue, please use private vulnerability reporting instead:
        https://github.com/rxova/template-oss/security/advisories/new

  - type: input
    id: version
    attributes:
      label: Version
      description: The package version you are using.
      placeholder: '1.0.0'
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Node version, operating system, and bundler or runtime if relevant.
      placeholder: 'Node 24, macOS 26'
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what happened, and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: The smallest code that shows the problem, or a link to a repository.
      render: ts
    validations:
      required: false
