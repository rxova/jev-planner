name: PR title

# The squash-merge subject is the PR *title*: no commit in the branch contains
# it, and `edited` lets someone change it after CI has already gone green, so it
# is checked on every edit. It lives here rather than in CI's `types:` because
# `edited` also fires on body edits, and there is no trigger-level way to tell
# the two apart. Here the same edit costs one job under a name nothing requires.

on:
  pull_request:
    types: [opened, edited, reopened]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  title:
    name: commit message (PR title)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-pnpm
      - run: pnpm install --frozen-lockfile

      # Read live from the API rather than out of `github.event`, so an
      # overlapping older run cannot affirm a title a newer edit has broken.
      # Piped, never interpolated — a PR title is attacker-controlled text.
      - name: Lint the PR title
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -o pipefail
          gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json title --jq .title \
            | pnpm exec commitlint --verbose
