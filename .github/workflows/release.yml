name: Release

# Runs only after CI has gone green on main, so nothing publishes that a pull
# request would have been blocked on. changesets/action opens a
# `chore: version packages` pull request and publishes only once that pull
# request is merged — a bad bump is visible before it is on npm, immutably.
#
# Publishing is opt-in: set the repository variable RELEASE_ENABLED to `true`
# once npm trusted publishing is configured (see the README). Until then, this
# job is skipped.
#
# A publish that includes jev-planner then redeploys the docs (docs.yml, called
# below) from the release commit, so jev-planner.com describes what npm serves.
# The version-bump push to main does not deploy on its own for that reason:
# until the publish succeeds, the new version is not installable.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency: release-${{ github.ref }}

permissions:
  contents: read

jobs:
  release:
    # workflow_run fires on failure as well, so the conclusion is checked.
    if: >-
      vars.RELEASE_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.released.outputs.version }}
      sha: ${{ steps.released.outputs.sha }}
    env:
      # The version commit would otherwise fire the pre-commit hook. CI already
      # gated this code on the pull request.
      HUSKY: '0'
    permissions:
      contents: write # version commit and tags
      pull-requests: write # the version pull request
      id-token: write # npm trusted publishing (OIDC), with provenance
    steps:
      - uses: actions/checkout@v7
        with:
          # By name, not the workflow_run's detached SHA, so the action knows
          # its base branch when it opens the version pull request.
          ref: main
          fetch-depth: 0
      - uses: ./.github/actions/setup-pnpm
        with:
          registry-url: 'https://registry.npmjs.org'
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@^11.5.1
      - run: pnpm install --frozen-lockfile

      - name: Create version PR or publish
        id: changesets
        uses: changesets/action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          version-script: pnpm exec changeset version
          # Builds only the published packages, then `changeset publish`.
          publish-script: pnpm run release
          commit-message: 'chore: version packages'
          pr-title: 'chore: version packages'
        env:
          NPM_CONFIG_PROVENANCE: 'true'

      # Empty unless this run published jev-planner. A bumped manifest that did
      # not publish is a release the docs would silently miss, so it fails.
      - name: Read the released jev-planner version
        id: released
        env:
          PUBLISHED: ${{ steps.changesets.outputs.published }}
          PACKAGES: ${{ steps.changesets.outputs.publishedPackages }}
        run: |
          version=''
          if [ "$PUBLISHED" = 'true' ]; then
            version=$(jq -r '.[] | select(.name == "jev-planner") | .version' <<<"$PACKAGES")
            manifest=$(jq -r .version packages/jev-planner/package.json)
            before=$(git show HEAD^:packages/jev-planner/package.json | jq -r .version || true)
            if [ -z "$version" ] && [ "$manifest" != "$before" ]; then
              echo "::error::jev-planner went from $before to $manifest but was not published"
              exit 1
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "Released jev-planner: ${version:-(none)}"

  docs:
    needs: release
    if: needs.release.outputs.version != ''
    uses: ./.github/workflows/docs.yml
    with:
      released-version: ${{ needs.release.outputs.version }}
      ref: ${{ needs.release.outputs.sha }}
    permissions:
      contents: read
      pages: write
      id-token: write
