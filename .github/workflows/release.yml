name: Release

# Runs only after CI has gone green on main, so nothing publishes that a pull
# request would have been blocked on. changesets/action opens a
# `chore: version packages` pull request and publishes only once that pull
# request is merged — a bad bump is visible before it is on npm, immutably.
#
# Publishing is opt-in: set the repository variable RELEASE_ENABLED to `true`
# once npm trusted publishing is configured (see the README). Until then, the
# release job is skipped.
#
# A publish that includes jev-planner then redeploys the docs (docs.yml, called
# below) from the release commit, so jev-planner.com describes what npm serves.
# The version-bump push to main does not deploy on its own for that reason:
# until the publish succeeds, the new version is not installable.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency: release-${{ github.ref }}

permissions:
  contents: read

jobs:
  release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: write # version commit and tags
      pull-requests: write # the version pull request
      id-token: write # npm trusted publishing (OIDC), with provenance
    uses: rxova/shared/.github/workflows/changesets-release.yml@main
    with:
      enabled: ${{ vars.RELEASE_ENABLED == 'true' }}

  # Which jev-planner version the release job published, if any, and the commit
  # it was published from. A version bump on main that did not reach npm fails
  # here rather than leaving the site describing a version nobody can install.
  released:
    needs: release
    if: needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.read.outputs.version }}
      sha: ${{ steps.read.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          # The parent, to tell a version bump from any other commit.
          fetch-depth: 2
      - name: Read the released jev-planner version
        id: read
        env:
          PACKAGES: ${{ needs.release.outputs.published-packages }}
        run: |
          version=$(jq -r '.[] | select(.name == "jev-planner") | .version' <<<"$PACKAGES")
          manifest=$(jq -r .version packages/jev-planner/package.json)
          before=$(git show HEAD^:packages/jev-planner/package.json | jq -r .version || true)
          if [ -z "$version" ] && [ "$manifest" != "$before" ]; then
            echo "::error::jev-planner went from $before to $manifest but was not published"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "Released jev-planner: ${version:-(none)}"

  docs:
    needs: released
    if: needs.released.outputs.version != ''
    uses: ./.github/workflows/docs.yml
    with:
      released-version: ${{ needs.released.outputs.version }}
      ref: ${{ needs.released.outputs.sha }}
    permissions:
      contents: read
      pages: write
      id-token: write
