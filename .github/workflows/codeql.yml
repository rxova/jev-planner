name: CodeQL

# The one check here that reads the code for a class of problem the type system
# and the tests do not: injection, prototype pollution, an unsafe dynamic
# property write. The planner reads a JSON config and spawns the agent CLIs,
# so neither is hypothetical.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, because the query pack changes without this tree changing.
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze
    uses: rxova/shared/.github/workflows/codeql-analysis.yml@main
