name: CI

# Every job is a reusable workflow from rxova/shared, called at @main. What
# stays here is the graph: which jobs run, and when. The steps are the ones
# `pnpm run verify` runs, and the pre-push hook runs that end to end, so a
# green push is a green pipeline.
#
# The docs site is not built here: docs.yml builds it for jev-planner.com, runs
# its browser tests against that dist and deploys it.

on:
  push:
    branches: [main]
  pull_request:
    # No `edited`: the title check lives in pr-title.yml. `labeled`/`unlabeled`
    # re-run the changeset gate, whose escape hatch is a label.
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

# Superseded pull request runs are cancelled; main runs always finish, because
# Release reads this workflow's conclusion to decide whether to publish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  commitlint:
    name: commit messages
    uses: rxova/shared/.github/workflows/commit-messages.yml@main

  checks:
    name: lint · format · types · build
    needs: [commitlint]
    if: needs.commitlint.outputs.code-changed == 'true'
    uses: rxova/shared/.github/workflows/repo-checks.yml@main
    with:
      build-command: pnpm exec turbo run build --filter='!@repo/docs'
      extra-command: pnpm run check:llms

  test:
    name: unit
    needs: [commitlint]
    if: needs.commitlint.outputs.code-changed == 'true'
    uses: rxova/shared/.github/workflows/unit-tests.yml@main
    with:
      # Linux only, as before. The planner spawns agent CLIs and resolves config
      # paths, and the suite has not been run on macOS or Windows yet.
      operating-systems: '["ubuntu-latest"]'
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  supply-chain:
    name: audit · sherif · knip · dedupe
    needs: [commitlint]
    if: needs.commitlint.outputs.code-changed == 'true'
    uses: rxova/shared/.github/workflows/supply-chain.yml@main

  package:
    name: package contract
    needs: [commitlint]
    if: needs.commitlint.outputs.code-changed == 'true'
    uses: rxova/shared/.github/workflows/package-contract.yml@main

  # The package supports Node >= 20.19, but pnpm needs >= 22.13 to install, so
  # the floor is exercised against the real tarball with plain `node`.
  compat:
    name: published package on the engines floor
    needs: [commitlint]
    if: needs.commitlint.outputs.code-changed == 'true'
    uses: rxova/shared/.github/workflows/node-floor-smoke.yml@main

  docs-checks:
    name: docs checks
    needs: [commitlint]
    if: needs.commitlint.outputs.docs-only == 'true'
    uses: rxova/shared/.github/workflows/docs-checks.yml@main
    with:
      command: pnpm run prettier:check

  changeset:
    name: changeset present
    needs: [commitlint]
    uses: rxova/shared/.github/workflows/changeset-gate.yml@main

  # The one context branch protection requires. `skipped` passes; `failure`
  # and `cancelled` do not.
  gate:
    name: all checks
    if: always()
    needs: [commitlint, checks, test, supply-chain, package, compat, docs-checks, changeset]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: rxova/shared/actions/require-jobs@main
        with:
          needs: ${{ toJSON(needs) }}
